name: deploy
on:
  push:
    branches: [master]

# The default GITHUB_TOKEN is read-only on new repositories, so the index
# commit below cannot be pushed without this. Settings -> Actions -> General
# -> Workflow permissions must also be set to "Read and write permissions".
permissions:
  contents: write

jobs:
  reapack-index:
    runs-on: ubuntu-latest
    steps:
    - name: Fetch repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Configure git
      run: |-
        git config user.name  'github-actions[bot]'
        git config user.email 'github-actions[bot]@users.noreply.github.com'
    - name: Install Pandoc
      run:  sudo apt-get install -yy pandoc
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.2
    - name: Install reapack-index
      run:  gem install reapack-index
    - name: Update index.xml
      run:  reapack-index --commit
    - name: Push changes
      run:  git push
